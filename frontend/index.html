<html lang="en" data-theme="dark">

    <title>ShiftLine · ALSTOM — Signalling & Communication Workforce Management System</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('shiftline-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
